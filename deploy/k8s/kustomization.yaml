apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stealth-browser
resources:
  - namespace.yaml
  - pvc.yaml
  - camoufox-deployment.yaml
  - camoufox-service.yaml
  - camoufox-networkpolicy.yaml
  - gateway-deployment.yaml
  - gateway-service.yaml
  - ingress.yaml
configMapGenerator:
  - name: camoufox-fingerprint
    files:
      - fingerprint.json=../../profiles/fingerprint.json
generatorOptions:
  disableNameSuffixHash: true
