apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: searxng
    server:
      limiter: false
      image_proxy: false
    search:
      formats:
        - html
        - json
    engines:
      - name: braveapi
        api_key: "__BRAVE_API_KEY__"
        inactive: false
      - name: brave
        disabled: true
      - name: google
        disabled: true
      - name: stealth google
        engine: stealth_google
        shortcut: gg
        timeout: 60
        disabled: false
